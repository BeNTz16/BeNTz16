  <style>
    .script{font-family:'Segoe Script','Snell Roundhand','Apple Chancery','Lucida Handwriting','URW Chancery L',cursive}
    .serif{font-family:'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L',Georgia,serif}
    .name{font-size:82px;fill:#3b2a1a;stroke:#3b2a1a;stroke-width:1.1;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:0;
      animation:draw 3.2s ease-in-out .3s both,ink 1.4s ease-in 2.3s both}
    .flourish{fill:none;stroke:#8a6a3a;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:0;animation:line 1.6s ease-out 3.2s both}
    .gem{fill:#b0812f;animation:fade .6s ease-out 3.1s both}
    .sub{font-size:20px;font-style:italic;fill:#5a3f24;animation:fade 1.2s ease-out 3.8s both}
    .top{font-size:12px;letter-spacing:4px;fill:#8a6a3a;animation:fade 1.2s ease-out .2s both}
    .rot{font-size:17px;fill:#7a1f1f;letter-spacing:.5px;opacity:0;animation:rot 16s linear infinite}
    .r1{animation-delay:5s}.r2{animation-delay:9s}.r3{animation-delay:13s}.r4{animation-delay:17s}
    @keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
    @keyframes ink{from{fill-opacity:0}to{fill-opacity:1}}
    @keyframes line{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes rot{0%{opacity:0}4%{opacity:1}21%{opacity:1}25%{opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.r1{opacity:1}}
  </style>
