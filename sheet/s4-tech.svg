  <g transform="translate(247 124) rotate(1.5)"><g class="st b s2" opacity=".86"><rect x="-72" y="-19" width="144" height="38" rx="4" stroke-width="1.8"/><rect x="-68" y="-15" width="136" height="30" rx="2" stroke-width=".7"/><text y="6">JAVASCRIPT</text></g></g>
  <g transform="translate(371.5 124) rotate(-1)"><g class="st a s3" opacity=".86"><rect x="-38.500" y="-19" width="77" height="38" rx="4" stroke-width="1.8"/><rect x="-34.500" y="-15" width="69" height="30" rx="2" stroke-width=".7"/><text y="6">HTML</text></g></g>
  <g transform="translate(457 124) rotate(2)"><g class="st c s4" opacity=".86"><rect x="-33" y="-19" width="66" height="38" rx="4" stroke-width="1.8"/><rect x="-29" y="-15" width="58" height="30" rx="2" stroke-width=".7"/><text y="6">CSS</text></g></g>
  <g transform="translate(548 124) rotate(-1.5)"><g class="st b s5" opacity=".86"><rect x="-44" y="-19" width="88" height="38" rx="4" stroke-width="1.8"/><rect x="-40" y="-15" width="80" height="30" rx="2" stroke-width=".7"/><text y="6">MYSQL</text></g></g>
  <g transform="translate(655.5 124) rotate(1)"><g class="st a s6" opacity=".86"><rect x="-49.500" y="-19" width="99" height="38" rx="4" stroke-width="1.8"/><rect x="-45.500" y="-15" width="91" height="30" rx="2" stroke-width=".7"/><text y="6">DOCKER</text></g></g>

  <g transform="translate(173.5 182) rotate(1.5)"><g class="st c s7" opacity=".86"><rect x="-49.500" y="-19" width="99" height="38" rx="4" stroke-width="1.8"/><rect x="-45.500" y="-15" width="91" height="30" rx="2" stroke-width=".7"/><text y="6">APACHE</text></g></g>
  <g transform="translate(281 182) rotate(-2)"><g class="st a s8" opacity=".86"><rect x="-44" y="-19" width="88" height="38" rx="4" stroke-width="1.8"/><rect x="-40" y="-15" width="80" height="30" rx="2" stroke-width=".7"/><text y="6">LINUX</text></g></g>
  <g transform="translate(411 182) rotate(1)"><g class="st b s9" opacity=".86"><rect x="-72" y="-19" width="144" height="38" rx="4" stroke-width="1.8"/><rect x="-68" y="-15" width="136" height="30" rx="2" stroke-width=".7"/><text y="6">CLOUDFLARE</text></g></g>
  <g transform="translate(530 182) rotate(-1.5)"><g class="st a s10" opacity=".86"><rect x="-33" y="-19" width="66" height="38" rx="4" stroke-width="1.8"/><rect x="-29" y="-15" width="58" height="30" rx="2" stroke-width=".7"/><text y="6">GIT</text></g></g>
  <g transform="translate(626.5 182) rotate(2)"><g class="st c s11" opacity=".86"><rect x="-49.500" y="-19" width="99" height="38" rx="4" stroke-width="1.8"/><rect x="-45.500" y="-15" width="91" height="30" rx="2" stroke-width=".7"/><text y="6">GITHUB</text></g></g>
