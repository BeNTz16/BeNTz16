    <path d="M16 0 L12 16 L21 32 L14 48 L23 64 L11 80 L18 96 L9 112 L20 128 L13 144 L22 160 L15 176 L10 192 L19 208 L12 224 L23 240 L16 256 L9 272 L21 288 L16 310 M784 0 L789 16 L782 22 L754 25 L731 23 L710 29 L687 27 L665 32 L641 30 L618 35 L595 34 L572 38 L540 40 L570 43 L593 42 L617 47 L643 45 L665 51 L692 48 L714 55 L740 52 L760 58 L781 56 L788 72 L778 88 L786 104 L791 120 L780 136 L788 152 L777 168 L785 184 L779 200 L790 216 L782 232 L787 248 L778 264 L791 280 L783 296 L784 310" fill="none" stroke="#6b3f14" stroke-opacity=".35" stroke-width="5" filter="url(#edge-burn)"/>
