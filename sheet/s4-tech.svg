<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 800 310" width="800" height="310" role="img" aria-label="Tech Stack: PHP, JavaScript, HTML, CSS, MySQL, Docker, Apache, Linux, Cloudflare, Git, GitHub">
  <defs>
    <linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="16" y1="0" x2="784" y2="0">
      <stop offset="0" stop-color="#dcc592"/><stop offset=".07" stop-color="#e9d7ab"/><stop offset=".5" stop-color="#f0e2bd"/><stop offset=".93" stop-color="#e9d7ab"/><stop offset="1" stop-color="#dcc592"/>
    </linearGradient>
    <filter id="paper" filterUnits="userSpaceOnUse" x="-8" y="-8" width="816" height="326" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9" result="fine"/>
      <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0 0.12  0.9 0 0 0 -0.30" result="speck"/>
      <feComposite in="speck" in2="SourceAlpha" operator="in" result="texIn"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="texIn"/></feMerge>
    </filter>
    <filter id="edge-burn" filterUnits="userSpaceOnUse" x="-8" y="-8" width="816" height="326"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="paper-clip"><path d="M16 0 L12 16 L21 32 L14 48 L23 64 L11 80 L18 96 L9 112 L20 128 L13 144 L22 160 L15 176 L10 192 L19 208 L12 224 L23 240 L16 256 L9 272 L21 288 L16 310 L16 316 L784 316 L784 310 L783 296 L791 280 L778 264 L787 248 L782 232 L790 216 L779 200 L785 184 L777 168 L788 152 L780 136 L791 120 L786 104 L778 88 L788 72 L781 56 L760 58 L740 52 L714 55 L692 48 L665 51 L643 45 L617 47 L593 42 L570 43 L540 40 L572 38 L595 34 L618 35 L641 30 L665 32 L687 27 L710 29 L731 23 L754 25 L782 22 L789 16 L784 0 L784 -6 L16 -6 L16 0  Z" fill-rule="evenodd" clip-rule="evenodd"/></clipPath>
  </defs>
  <style>
    .script{font-family:'Segoe Script','Snell Roundhand','Apple Chancery','Lucida Handwriting','URW Chancery L',cursive}
    .h{font-size:38px;fill:#3b2a1a;stroke:#3b2a1a;stroke-width:.8;stroke-dasharray:500;stroke-dashoffset:0;animation:draw 2.4s ease-in-out .2s both,ink 1s ease-in 1.5s both}
    .side{fill:none;stroke:#8a6a3a;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:0;animation:line 1.4s ease-out 1.6s both}
    .st{transform-box:fill-box;transform-origin:center;animation:stamp .4s cubic-bezier(.3,1.5,.5,1) both,reink 11s ease-in-out infinite}
    .st rect{fill:none;stroke:currentColor}
    .st text{font-family:'Courier New',Courier,'Liberation Mono',monospace;font-size:17px;font-weight:bold;letter-spacing:1px;fill:currentColor;text-anchor:middle}
    .a{color:#3b2a1a}.b{color:#7a1f1f}.c{color:#4f6b3a}
    .s1{animation-delay:2s,6s}.s2{animation-delay:2.15s,7s}.s3{animation-delay:2.3s,8s}.s4{animation-delay:2.45s,9s}
    .s5{animation-delay:2.6s,10s}.s6{animation-delay:2.75s,11s}.s7{animation-delay:2.9s,12s}.s8{animation-delay:3.05s,13s}
    .s9{animation-delay:3.2s,14s}.s10{animation-delay:3.35s,15s}.s11{animation-delay:3.5s,16s}
    @keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
    @keyframes ink{from{fill-opacity:0}to{fill-opacity:1}}
    @keyframes line{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
    @keyframes stamp{from{opacity:0;transform:scale(1.6)}to{opacity:.86;transform:scale(1)}}
    @keyframes reink{0%,12%,100%{opacity:.86}6%{opacity:1;transform:scale(1.06)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <path id="paper-shape" d="M16 0 L12 16 L21 32 L14 48 L23 64 L11 80 L18 96 L9 112 L20 128 L13 144 L22 160 L15 176 L10 192 L19 208 L12 224 L23 240 L16 256 L9 272 L21 288 L16 310 L16 316 L784 316 L784 310 L783 296 L791 280 L778 264 L787 248 L782 232 L790 216 L779 200 L785 184 L777 168 L788 152 L780 136 L791 120 L786 104 L778 88 L788 72 L781 56 L760 58 L740 52 L714 55 L692 48 L665 51 L643 45 L617 47 L593 42 L570 43 L540 40 L572 38 L595 34 L618 35 L641 30 L665 32 L687 27 L710 29 L731 23 L754 25 L782 22 L789 16 L784 0 L784 -6 L16 -6 L16 0  Z" fill-rule="evenodd" fill="url(#pg)" filter="url(#paper)"/>
