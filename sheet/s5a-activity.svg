    <path d="M17 22 L42 24 L65 28 L87 27 L111 32 L132 35 L150 38 L128 41 L108 40 L87 46 L63 43 L42 50 L19 48 M689 26 L699 21 L707 24 L719 22 L729 29 L725 35 L728 40 L717 43 L709 39 L698 42 L690 35 L692 30 Z" fill="none" stroke="#5a3413" stroke-opacity=".55" stroke-width="1.4"/>
  </g>
  <g transform="translate(0,60)">
  <text class="script h" x="400" y="70" text-anchor="middle">Activity</text>
  <path class="side" d="M280 58C230 50 180 66 90 58"/>
