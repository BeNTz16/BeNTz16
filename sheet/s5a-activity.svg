<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 800 150" width="800" height="150" role="img" aria-label="Activity">
  <defs>
    <linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="16" y1="0" x2="784" y2="0">
      <stop offset="0" stop-color="#dcc592"/><stop offset=".07" stop-color="#e9d7ab"/><stop offset=".5" stop-color="#f0e2bd"/><stop offset=".93" stop-color="#e9d7ab"/><stop offset="1" stop-color="#dcc592"/>
    </linearGradient>
    <filter id="paper" filterUnits="userSpaceOnUse" x="-8" y="-8" width="816" height="166" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9" result="fine"/>
      <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0 0.12  0.9 0 0 0 -0.30" result="speck"/>
      <feComposite in="speck" in2="SourceAlpha" operator="in" result="texIn"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="texIn"/></feMerge>
    </filter>
    <filter id="edge-burn" filterUnits="userSpaceOnUse" x="-8" y="-8" width="816" height="166"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="paper-clip"><path d="M16 0 L22 16 L17 22 L42 24 L65 28 L87 27 L111 32 L132 35 L150 38 L128 41 L108 40 L87 46 L63 43 L42 50 L19 48 L11 64 L21 80 L14 96 L23 112 L10 128 L18 144 L16 150 L16 156 L784 156 L784 150 L787 144 L778 128 L789 112 L781 96 L790 80 L786 64 L777 48 L788 32 L779 16 L784 0 L784 -6 L16 -6 L16 0  Z M689 26 L699 21 L707 24 L719 22 L729 29 L725 35 L728 40 L717 43 L709 39 L698 42 L690 35 L692 30 Z" fill-rule="evenodd" clip-rule="evenodd"/></clipPath>
  </defs>
  <style>
    .script{font-family:'Segoe Script','Snell Roundhand','Apple Chancery','Lucida Handwriting','URW Chancery L',cursive}
    .h{font-size:38px;fill:#3b2a1a;stroke:#3b2a1a;stroke-width:.8;stroke-dasharray:500;stroke-dashoffset:0;animation:draw 2.4s ease-in-out .2s both,ink 1s ease-in 1.5s both}
    .side{fill:none;stroke:#8a6a3a;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:0;animation:line 9s ease-in-out 1.6s infinite both}
    @keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
    @keyframes ink{from{fill-opacity:0}to{fill-opacity:1}}
    @keyframes line{0%{stroke-dashoffset:240;opacity:1}22%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
