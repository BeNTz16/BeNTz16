<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 800 620" width="800" height="620" role="img" aria-label="Karbonify — a social platform that calculates carbon footprints and gamifies eco-friendly actions">
  <defs>
    <linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="16" y1="0" x2="784" y2="0">
      <stop offset="0" stop-color="#dcc592"/><stop offset=".07" stop-color="#e9d7ab"/><stop offset=".5" stop-color="#f0e2bd"/><stop offset=".93" stop-color="#e9d7ab"/><stop offset="1" stop-color="#dcc592"/>
    </linearGradient>
    <filter id="paper" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="620" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9" result="fine"/>
      <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0 0.12  0.9 0 0 0 -0.30" result="speck"/>
      <feComposite in="speck" in2="SourceAlpha" operator="in" result="texIn"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="texIn"/></feMerge>
    </filter>
    <filter id="edge-burn" filterUnits="userSpaceOnUse" x="0" y="0" width="800" height="620"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="paper-clip"><path d="M16 0 L13 16 L18 22 L47 25 L63 23 L82 29 L103 27 L121 32 L144 30 L166 35 L190 34 L215 38 L250 40 L221 43 L198 42 L176 47 L150 45 L130 51 L106 48 L85 55 L60 52 L42 58 L19 56 L14 72 L16 88 L13 104 L20 120 L10 136 L18 152 L23 168 L14 184 L21 200 L11 216 L17 232 L9 248 L19 264 L13 280 L20 296 L10 312 L18 328 L23 344 L14 360 L21 376 L11 392 L17 408 L9 424 L19 440 L13 456 L20 472 L10 488 L18 504 L23 520 L14 536 L21 552 L11 568 L17 584 L9 600 L16 620 L784 620 L784 620 L791 608 L786 592 L778 576 L788 560 L781 544 L787 528 L777 512 L785 496 L779 480 L789 464 L782 448 L791 432 L786 416 L778 400 L788 384 L781 368 L787 352 L777 336 L785 320 L779 304 L789 288 L782 272 L791 256 L786 240 L778 224 L788 208 L781 192 L787 176 L777 160 L785 144 L779 128 L789 112 L782 96 L791 80 L786 64 L778 48 L788 32 L781 16 L784 0 Z"/></clipPath>
  </defs>
  <style>
    .script{font-family:'Segoe Script','Snell Roundhand','Apple Chancery','Lucida Handwriting','URW Chancery L',cursive}
    .serif{font-family:'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L',Georgia,serif}
    .h{font-size:42px;fill:#3b2a1a;stroke:#3b2a1a;stroke-width:.8;stroke-dasharray:500;stroke-dashoffset:0;animation:draw 2.4s ease-in-out .2s both,ink 1s ease-in 1.5s both}
    .rule{fill:none;stroke:#8a6a3a;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:620;stroke-dashoffset:0;animation:line 1.8s ease-out 1.6s both}
    .q{font-size:20px;font-style:italic;fill:#5a3f24;animation:fade 1.2s ease-out 2.2s both}
    .bar{fill:#7a1f1f;fill-opacity:.7}
    .lab{font-size:21px;font-weight:bold;fill:#7a1f1f;letter-spacing:.6px}
    .d{font-size:19px;fill:#3b2a1a}
    .it{animation:rise .8s ease-out both}
    .i1{animation-delay:2.8s}.i2{animation-delay:3.2s}.i3{animation-delay:3.6s}.i4{animation-delay:4s}.i5{animation-delay:4.4s}
    .dot{fill:#3b2a1a;transform-box:fill-box;transform-origin:center;animation:pulse 10s ease-in-out infinite}
    .d1{animation-delay:5s}.d2{animation-delay:7s}.d3{animation-delay:9s}.d4{animation-delay:11s}.d5{animation-delay:13s}
    .sprout{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
    @keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
    @keyframes ink{from{fill-opacity:0}to{fill-opacity:1}}
    @keyframes line{from{stroke-dashoffset:620}to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,14%,100%{fill:#3b2a1a;transform:scale(1)}7%{fill:#b0812f;transform:scale(1.7)}}
    @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <path id="paper-shape" d="M16 0 L13 16 L18 22 L47 25 L63 23 L82 29 L103 27 L121 32 L144 30 L166 35 L190 34 L215 38 L250 40 L221 43 L198 42 L176 47 L150 45 L130 51 L106 48 L85 55 L60 52 L42 58 L19 56 L14 72 L16 88 L13 104 L20 120 L10 136 L18 152 L23 168 L14 184 L21 200 L11 216 L17 232 L9 248 L19 264 L13 280 L20 296 L10 312 L18 328 L23 344 L14 360 L21 376 L11 392 L17 408 L9 424 L19 440 L13 456 L20 472 L10 488 L18 504 L23 520 L14 536 L21 552 L11 568 L17 584 L9 600 L16 620 L784 620 L784 620 L791 608 L786 592 L778 576 L788 560 L781 544 L787 528 L777 512 L785 496 L779 480 L789 464 L782 448 L791 432 L786 416 L778 400 L788 384 L781 368 L787 352 L777 336 L785 320 L779 304 L789 288 L782 272 L791 256 L786 240 L778 224 L788 208 L781 192 L787 176 L777 160 L785 144 L779 128 L789 112 L782 96 L791 80 L786 64 L778 48 L788 32 L781 16 L784 0 Z" fill="url(#pg)" filter="url(#paper)"/>
  <g clip-path="url(#paper-clip)">
    <path d="M16 0 L13 16 L18 22 L47 25 L63 23 L82 29 L103 27 L121 32 L144 30 L166 35 L190 34 L215 38 L250 40 L221 43 L198 42 L176 47 L150 45 L130 51 L106 48 L85 55 L60 52 L42 58 L19 56 L14 72 L16 88 L13 104 L20 120 L10 136 L18 152 L23 168 L14 184 L21 200 L11 216 L17 232 L9 248 L19 264 L13 280 L20 296 L10 312 L18 328 L23 344 L14 360 L21 376 L11 392 L17 408 L9 424 L19 440 L13 456 L20 472 L10 488 L18 504 L23 520 L14 536 L21 552 L11 568 L17 584 L9 600 L16 620 M784 0 L781 16 L788 32 L778 48 L786 64 L791 80 L782 96 L789 112 L779 128 L785 144 L777 160 L787 176 L781 192 L788 208 L778 224 L786 240 L791 256 L782 272 L789 288 L779 304 L785 320 L777 336 L787 352 L781 368 L788 384 L778 400 L786 416 L791 432 L782 448 L789 464 L779 480 L785 496 L777 512 L787 528 L781 544 L788 560 L778 576 L786 592 L791 608 L784 620" fill="none" stroke="#6b3f14" stroke-opacity=".35" stroke-width="5" filter="url(#edge-burn)"/>
    <path d="M18 22 L47 25 L63 23 L82 29 L103 27 L121 32 L144 30 L166 35 L190 34 L215 38 L250 40 L221 43 L198 42 L176 47 L150 45 L130 51 L106 48 L85 55 L60 52 L42 58 L19 56" fill="none" stroke="#5a3413" stroke-opacity=".55" stroke-width="1.4"/>
  </g>
  <g transform="translate(0,60)">

  

  <g transform="translate(92 96)">
    <g class="sprout" fill="#4f6b3a" stroke="#3d5430" stroke-width="1.2" stroke-linejoin="round">
      <path d="M0 0C-2 -12-1 -22 0 -32" fill="none" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M0 -20C-14 -22-20 -32-18 -42C-7 -40 0 -31 0 -20z"/>
      <path d="M0 -28C10 -30 16 -38 15 -47C6 -45 0 -38 0 -28z"/>
    </g>
  </g>
  <text class="script h" x="122" y="92">Karbonify</text>
  <path class="rule" d="M70 116C220 108 380 124 560 114S700 112 730 116"/>

  <rect class="bar" x="70" y="140" width="3" height="54" rx="1.5"/>
  <g class="serif q">
    <text x="88" y="160">A social platform I co-founded that measures carbon footprints</text>
    <text x="88" y="187">and rewards eco-friendly action through gamification.</text>
  </g>

  <g class="serif">
    <g class="it i1">
      <path class="dot d1" d="M84 241l7 7-7 7-7-7z"/>
      <text class="lab" x="108" y="255">Interactive Map</text>
      <text class="d" x="108" y="280">Recycling points, reported pollution sites, and location-based tasks</text>
    </g>
    <g class="it i2">
      <path class="dot d2" d="M84 301l7 7-7 7-7-7z"/>
      <text class="lab" x="108" y="315">Community Events</text>
      <text class="d" x="108" y="340">Cleanup meetups with attendance check-in, event rooms, and galleries</text>
    </g>
    <g class="it i3">
      <path class="dot d3" d="M84 361l7 7-7 7-7-7z"/>
      <text class="lab" x="108" y="375">Gamification</text>
      <text class="d" x="108" y="400">XP, daily tasks, streaks, leagues, and leaderboards</text>
    </g>
    <g class="it i4">
      <path class="dot d4" d="M84 421l7 7-7 7-7-7z"/>
      <text class="lab" x="108" y="435">Photo Verification</text>
      <text class="d" x="108" y="460">Photo-verified actions, a moderation queue, and an admin panel</text>
    </g>
    <g class="it i5">
      <path class="dot d5" d="M84 481l7 7-7 7-7-7z"/>
      <text class="lab" x="108" y="495">Progressive Web App</text>
      <text class="d" x="108" y="520">Mobile-first interface with web push notifications</text>
    </g>
  </g>
  </g>
</svg>
