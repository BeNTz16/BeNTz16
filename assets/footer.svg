<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170" role="img" aria-label="Coding for one more breath tomorrow. — Ali">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e7c6"/>
      <stop offset=".55" stop-color="#ecdbb2"/>
      <stop offset="1" stop-color="#e0c996"/>
    </linearGradient>
    <radialGradient id="burn" cx=".5" cy=".5" r=".74">
      <stop offset=".62" stop-color="#7a4f1e" stop-opacity="0"/>
      <stop offset="1" stop-color="#6b3f14" stop-opacity=".42"/>
    </radialGradient>
    <filter id="paper" x="-5%" y="-16%" width="110%" height="132%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="77" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="10" xChannelSelector="R" yChannelSelector="G" result="sheet"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="19" result="fine"/>
      <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0 0.12  0.9 0 0 0 -0.30" result="speck"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="29" result="blot"/>
      <feColorMatrix in="blot" type="matrix" values="0 0 0 0 0.48  0 0 0 0 0.30  0 0 0 0 0.10  0.85 0 0 0 -0.36" result="stain"/>
      <feMerge result="tex"><feMergeNode in="stain"/><feMergeNode in="speck"/></feMerge>
      <feComposite in="tex" in2="sheet" operator="in" result="texIn"/>
      <feMerge><feMergeNode in="sheet"/><feMergeNode in="texIn"/></feMerge>
    </filter>
  </defs>
  <style>
    .script,.serif{font-family:'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L',Georgia,serif}
    .q{font-size:22px;font-style:italic;fill:#5a3f24}
    .flourish{fill:none;stroke:#8a6a3a;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:0;animation:line 10s ease-in-out infinite both}
    .gem{fill:#b0812f}
    .sig{font-size:26px;font-style:italic;letter-spacing:1px;fill:#7a1f1f;stroke:#7a1f1f;stroke-width:.4;stroke-dasharray:400;stroke-dashoffset:0;animation:sig 10s ease-in-out infinite both}
    @keyframes line{0%{stroke-dashoffset:260;opacity:1}18%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes sig{0%,12%{stroke-dashoffset:400;fill-opacity:0;stroke-opacity:1}34%{stroke-dashoffset:0;fill-opacity:0}44%,90%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:1}100%{stroke-dashoffset:0;fill-opacity:0;stroke-opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g filter="url(#paper)">
    <rect x="16" y="16" width="768" height="138" rx="5" fill="url(#pg)"/>
    <rect x="16" y="16" width="768" height="138" rx="5" fill="url(#burn)"/>
  </g>
  <text class="serif q" x="400" y="66" text-anchor="middle">“Coding for one more breath tomorrow.”</text>
  <path class="flourish" d="M388 92C350 92 322 82 284 92S236 102 228 90S242 78 248 88"/>
  <path class="flourish" d="M412 92C450 92 478 82 516 92S564 102 572 90S558 78 552 88"/>
  <path class="gem" d="M400 85l7 7-7 7-7-7z"/>
  <text class="script sig" x="660" y="128" text-anchor="middle">— Ali</text>
</svg>
