<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Ali Erdem — Co-founder @ Karbonify, Full-Stack Developer">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e7c6"/>
      <stop offset=".55" stop-color="#ecdbb2"/>
      <stop offset="1" stop-color="#e0c996"/>
    </linearGradient>
    <radialGradient id="burn" cx=".5" cy=".5" r=".72">
      <stop offset=".6" stop-color="#7a4f1e" stop-opacity="0"/>
      <stop offset="1" stop-color="#6b3f14" stop-opacity=".45"/>
    </radialGradient>
    <filter id="paper" x="-5%" y="-10%" width="110%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="4" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="10" xChannelSelector="R" yChannelSelector="G" result="sheet"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="9" result="fine"/>
      <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0 0.12  0.9 0 0 0 -0.30" result="speck"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="21" result="blot"/>
      <feColorMatrix in="blot" type="matrix" values="0 0 0 0 0.48  0 0 0 0 0.30  0 0 0 0 0.10  0.85 0 0 0 -0.36" result="stain"/>
      <feMerge result="tex"><feMergeNode in="stain"/><feMergeNode in="speck"/></feMerge>
      <feComposite in="tex" in2="sheet" operator="in" result="texIn"/>
      <feMerge><feMergeNode in="sheet"/><feMergeNode in="texIn"/></feMerge>
    </filter>
  </defs>
  <style>
    .script{font-family:'Segoe Script','Snell Roundhand','Apple Chancery','Lucida Handwriting','URW Chancery L',cursive}
    .serif{font-family:'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L',Georgia,serif}
    .name{font-size:82px;fill:#3b2a1a;stroke:#3b2a1a;stroke-width:1.1;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:0;
      animation:draw 3.2s ease-in-out .3s both,ink 1.4s ease-in 2.3s both}
    .flourish{fill:none;stroke:#8a6a3a;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:260;stroke-dashoffset:0;animation:line 1.6s ease-out 3.2s both}
    .gem{fill:#b0812f;animation:fade .6s ease-out 3.1s both}
    .sub{font-size:20px;font-style:italic;fill:#5a3f24;animation:fade 1.2s ease-out 3.8s both}
    .top{font-size:12px;letter-spacing:4px;fill:#8a6a3a;animation:fade 1.2s ease-out .2s both}
    .rot{font-size:17px;fill:#7a1f1f;letter-spacing:.5px;opacity:0;animation:rot 16s linear infinite}
    .r1{animation-delay:5s}.r2{animation-delay:9s}.r3{animation-delay:13s}.r4{animation-delay:17s}
    @keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
    @keyframes ink{from{fill-opacity:0}to{fill-opacity:1}}
    @keyframes line{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes rot{0%{opacity:0}4%{opacity:1}21%{opacity:1}25%{opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.r1{opacity:1}}
  </style>

  <g filter="url(#paper)">
    <rect x="16" y="16" width="768" height="298" rx="5" fill="url(#pg)"/>
    <rect x="16" y="16" width="768" height="298" rx="5" fill="url(#burn)"/>
  </g>

  <rect x="36" y="36" width="728" height="258" fill="none" stroke="#8a6a3a" stroke-opacity=".55"/>
  <rect x="41" y="41" width="718" height="248" fill="none" stroke="#8a6a3a" stroke-opacity=".28"/>
  <g fill="#8a6a3a" fill-opacity=".7">
    <path d="M36 30l6 6-6 6-6-6z"/><path d="M764 30l6 6-6 6-6-6z"/>
    <path d="M36 288l6 6-6 6-6-6z"/><path d="M764 288l6 6-6 6-6-6z"/>
  </g>

  <text class="serif top" x="400" y="78" text-anchor="middle">GITHUB.COM / BENTZ16</text>

  <text class="script name" x="400" y="166" text-anchor="middle">Ali Erdem</text>

  <path class="flourish" d="M388 196C350 196 322 186 284 196S236 206 228 194S242 182 248 192"/>
  <path class="flourish" d="M412 196C450 196 478 186 516 196S564 206 572 194S558 182 552 192"/>
  <path class="gem" d="M400 189l7 7-7 7-7-7z"/>

  <text class="serif sub" x="400" y="234" text-anchor="middle">Co-founder of Karbonify  •  Full-Stack Developer</text>

  <g class="serif" text-anchor="middle">
    <text class="rot r1" x="400" y="268">Building software that makes sustainable habits measurable.</text>
    <text class="rot r2" x="400" y="268">Co-founding and engineering Karbonify</text>
    <text class="rot r3" x="400" y="268">PHP  •  JavaScript  •  MariaDB  •  Docker</text>
    <text class="rot r4" x="400" y="268">Coding for one more breath tomorrow.</text>
  </g>

</svg>
