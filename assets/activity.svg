<svg xmlns="http://www.w3.org/2000/svg" lang="en" xml:lang="en" viewBox="0 0 800 112" width="800" height="112" role="img" aria-label="Activity">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e7c6"/>
      <stop offset=".55" stop-color="#ecdbb2"/>
      <stop offset="1" stop-color="#e0c996"/>
    </linearGradient>
    <radialGradient id="burn" cx=".5" cy=".5" r=".74">
      <stop offset=".62" stop-color="#7a4f1e" stop-opacity="0"/>
      <stop offset="1" stop-color="#6b3f14" stop-opacity=".4"/>
    </radialGradient>
    <filter id="paper" x="-5%" y="-25%" width="110%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="63" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="10" xChannelSelector="R" yChannelSelector="G" result="sheet"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="17" result="fine"/>
      <feColorMatrix in="fine" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0 0.12  0.9 0 0 0 -0.30" result="speck"/>
      <feComposite in="speck" in2="sheet" operator="in" result="texIn"/>
      <feMerge><feMergeNode in="sheet"/><feMergeNode in="texIn"/></feMerge>
    </filter>
  </defs>
  <style>
    .script{font-family:'Segoe Script','Snell Roundhand','Apple Chancery','Lucida Handwriting','URW Chancery L',cursive}
    .h{font-size:38px;fill:#3b2a1a;stroke:#3b2a1a;stroke-width:.8;stroke-dasharray:500;stroke-dashoffset:0;animation:draw 2.4s ease-in-out .2s both,ink 1s ease-in 1.5s both}
    .side{fill:none;stroke:#8a6a3a;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:0;animation:line 9s ease-in-out 1.6s infinite both}
    @keyframes draw{from{stroke-dashoffset:500}to{stroke-dashoffset:0}}
    @keyframes ink{from{fill-opacity:0}to{fill-opacity:1}}
    @keyframes line{0%{stroke-dashoffset:240;opacity:1}22%,88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g filter="url(#paper)">
    <rect x="16" y="16" width="768" height="80" rx="5" fill="url(#pg)"/>
    <rect x="16" y="16" width="768" height="80" rx="5" fill="url(#burn)"/>
  </g>
  <text class="script h" x="400" y="70" text-anchor="middle">Activity</text>
  <path class="side" d="M280 58C230 50 180 66 90 58"/>
  <path class="side" d="M520 58C570 50 620 66 710 58"/>
</svg>
